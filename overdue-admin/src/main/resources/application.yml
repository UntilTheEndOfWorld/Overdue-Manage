# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.7.0
  # 版权年份
  copyrightYear: 2022
  # 实例演示开关
  demoEnabled: false
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: /home/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: true
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math
  # 前端请求的 跟踪 header name
  traceIdName: x-web-trace-id

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # tomcat最大线程数，默认为200
    max-threads: 800
    # Tomcat启动初始化的线程数，默认值25
    min-spare-threads: 30
    # 最大连接数
    max-connections: 8192
    # 接受连接队列大小
    accept-count: 100
    # 连接超时时间
    connection-timeout: 20000
    # 启用严格的URL解析
    relaxed-query-chars: "|,{,},[,],\\"
    # 启用严格的路径解析
    relaxed-path-chars: "|,{,},[,],\\"
    # 最大HTTP头部大小
    # 最大POST大小
    max-http-post-size: 2097152
    # 启用压缩
    compression: on
    compression-min-size: 2048
    # 错误处理
    error-whitelabel-enabled: false

# 日志配置
logging:
  level:
    com.overdue: info
    org.springframework: warn

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles: 
    active: @spring.profiles.active@
  # 文件上传
  servlet:
     multipart:
       # 单个文件大小
       max-file-size:  10MB
       # 设置总上传的文件大小
       max-request-size:  20MB
  # 服务模块
  # devtools:
  #   restart:
  #     # 热部署开关
  #     enabled: true

# token配置
token:
    # 令牌自定义标识
    header: Authorization
    # 令牌密钥
#    secret: abcdefghijkomnopqrstuvwxyx
    secret: abcdefghijkShanLiRenXiaoPuomnopqrstuvwxyx
    # 令牌有效期（默认30分钟）-> 修改为2小时，解决发货时Token过期问题
    expireTime: 120
    # 会员令牌有效期（默认7天）
    memberExpireTime: 7
# mybatis-plus 配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.lyc.**.domain, com.overdue.common.core.domain.entity,  com.overdue.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml
  global-config:
    db-config:
      id-type: auto
      update-strategy: ignored
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql 

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: false
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss: 
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

extra:
  wx:
    appid: wxappid
    secret: wxsecret
    redirect: ""
scheduling:
  enabled: false

# 阿里云OSS配置
aliyun:
  # 阿里云访问密钥ID
  accessKeyId: LTAI5t7iQEnUDQyWqBT7FjxS
  # 阿里云访问密钥Secret
  secretAccessKey: 47TsKhJfugxtyj3YwoVTiBos6DHqro
  # OSS配置
  oss:
    # OSS服务端点
    endPoint: oss-cn-shenzhen.aliyuncs.com
    # OSS存储桶名称
    bucketName: slrxp
    # 自定义域名（可选）
    customDomain: 
    # 文件访问路径前缀
    pathPrefix: shanliren-mall/
    # 是否使用HTTPS
    useHttps: true
    # 连接超时时间（毫秒）
    connectionTimeout: 10000
    # 最大连接数
    maxConnections: 100

# 微信配置
